    <script>
        // Babel loads the external JSX files asynchronously. Wait for App instead
        // of displaying a false failure while those files are still compiling.
        (function renderWhenReady(attemptsLeft) {
            if (window.App && window.ReactDOM) {
                try {
                    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
                } catch (error) {
                    console.error('Render error:', error);
                    document.getElementById('root').textContent = 'Unable to load the application. Please refresh the page.';
                }
                return;
            }
            if (attemptsLeft > 0) {
                window.setTimeout(function () { renderWhenReady(attemptsLeft - 1); }, 50);
                return;
            }
            document.getElementById('root').textContent = 'Unable to load the application. Please refresh the page.';
        })(100);
    </script>
